name: Beauty and hospitality release checks

on:
  pull_request:
    paths:
      - "opus-dashboard/**"
      - "shared/**"
      - ".github/workflows/beauty-journey.yml"
  push:
    branches: [main, codex/hospitality-vertical]
    paths:
      - "opus-dashboard/**"
      - "shared/**"
      - ".github/workflows/beauty-journey.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beauty-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beauty-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: opus-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: opus-dashboard/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: beauty-journey-failure
          path: |
            opus-dashboard/playwright-report/
            opus-dashboard/test-results/
          retention-days: 7
