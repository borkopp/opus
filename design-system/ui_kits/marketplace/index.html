<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>OPUS MK · Marketplace</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background:var(--bg-1); color:var(--fg-1); font-family:var(--font-body); -webkit-font-smoothing:antialiased; font-feature-settings:"ss01","cv01"; }
  *{box-sizing:border-box}
  ::selection{background:var(--accent);color:#fff}
  /* scrollbar */
  *::-webkit-scrollbar{height:6px;width:6px}
  *::-webkit-scrollbar-thumb{background:var(--bg-5);border-radius:9999px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="CategoryBar.jsx"></script>
<script type="text/babel" src="BusinessCard.jsx"></script>
<script type="text/babel" src="BusinessProfile.jsx"></script>
<script type="text/babel" src="BookingFlow.jsx"></script>
<script type="text/babel">
const { useState } = React;

function DiscoveryView({ onOpen }) {
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('all');
  const filtered = MKT_BUSINESSES.filter(b=>
    (cat==='all' || b.category.toLowerCase().includes(cat==='barber'?'barber':cat==='hair'?'hair':cat==='nail'?'nail':cat==='spa'?'spa':cat==='lash'?'lash':cat==='tattoo'?'tattoo':cat))
    && (!q || b.name.toLowerCase().includes(q.toLowerCase()) || b.area.toLowerCase().includes(q.toLowerCase()))
  );
  return (
    <div>
      <MarketplaceHeader onSearch={setQ}/>
      <CategoryBar active={cat} onChange={setCat}/>
      <div style={{maxWidth:1280,margin:'0 auto',padding:'32px 24px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:24}}>
          <div>
            <div style={{fontFamily:'var(--font-body)',fontSize:11,fontWeight:700,letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--accent)'}}>Discover</div>
            <h1 style={{fontFamily:'var(--font-display)',fontWeight:500,fontSize:36,lineHeight:1.2,letterSpacing:'-0.02em',color:'var(--fg-1)',margin:'8px 0 0',textWrap:'balance'}}>
              Businesses in <span style={{fontFamily:'var(--font-serif)',fontStyle:'italic',color:'var(--accent)'}}>Skopje</span>
            </h1>
          </div>
          <div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--fg-3)'}}>{filtered.length} results</div>
        </div>
        {filtered.length===0 ? (
          <div style={{textAlign:'center',padding:'80px 0',fontFamily:'var(--font-body)',color:'var(--fg-3)'}}>
            No businesses found. Try a different search term.
          </div>
        ) : (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:16}}>
            {filtered.map(b=><BusinessCard key={b.id} b={b} onClick={()=>onOpen(b)}/>)}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [selected, setSelected] = useState(null);
  const [booking,  setBooking]  = useState(false);
  return (
    <div>
      {!selected && <DiscoveryView onOpen={setSelected}/>}
      {selected && (
        <div>
          <MarketplaceHeader/>
          <BusinessProfile b={selected} onBack={()=>setSelected(null)} onBook={()=>setBooking(true)}/>
        </div>
      )}
      {booking && <BookingFlow business={selected} onClose={()=>setBooking(false)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
