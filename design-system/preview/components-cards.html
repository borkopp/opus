<!doctype html>
<html><head><meta charset="utf-8"><title>Card — business</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Business card (marketplace tile)</div>
<div style="display:flex;gap:14px">
  <div style="flex:1;background:var(--bg-3);border:1px solid var(--border);border-radius:16px;overflow:hidden">
    <div style="height:100px;background:linear-gradient(135deg,#2a1712 0%,#5c2a1a 55%,#ce5d45 100%);position:relative">
      <span style="position:absolute;top:10px;left:10px;font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;background:rgba(0,0,0,0.5);color:#faf9f7;padding:4px 8px;border-radius:9999px;backdrop-filter:blur(8px)">Barbershop</span>
      <span style="position:absolute;top:10px;right:10px;font-family:var(--font-body);font-size:11px;background:rgba(0,0,0,0.55);color:#faf9f7;padding:4px 8px;border-radius:9999px;backdrop-filter:blur(8px)">★ 4.9</span>
    </div>
    <div style="padding:12px 14px">
      <div style="font-family:var(--font-display);font-size:16px;font-weight:500;color:var(--fg-1)">Studio Nord</div>
      <div style="font-family:var(--font-body);font-size:12px;color:var(--fg-3);margin-top:2px">Centar · Skopje</div>
    </div>
  </div>
  <div style="flex:1;background:var(--bg-3);border:1px solid var(--border);border-radius:16px;overflow:hidden">
    <div style="height:100px;background:linear-gradient(135deg,#1f2a24 0%,#2d4a3a 60%,#6fcf97 100%);position:relative">
      <span style="position:absolute;top:10px;left:10px;font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;background:rgba(0,0,0,0.5);color:#faf9f7;padding:4px 8px;border-radius:9999px;backdrop-filter:blur(8px)">Spa</span>
      <span style="position:absolute;top:10px;right:10px;font-family:var(--font-body);font-size:11px;background:rgba(78,169,122,0.8);color:#042611;padding:4px 8px;border-radius:9999px;font-weight:500">Open</span>
    </div>
    <div style="padding:12px 14px">
      <div style="font-family:var(--font-display);font-size:16px;font-weight:500;color:var(--fg-1)">Aroma Wellness</div>
      <div style="font-family:var(--font-body);font-size:12px;color:var(--fg-3);margin-top:2px">Debar Maalo · Skopje</div>
    </div>
  </div>
</div>
</div></body></html>
