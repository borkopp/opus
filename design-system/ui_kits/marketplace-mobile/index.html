<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>OPUS Marketplace · Mobile</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#111;color:var(--fg-1);font-family:var(--font-body);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv01";}
  *{box-sizing:border-box}
  ::selection{background:var(--accent);color:#fff}
  input::placeholder{color:var(--fg-3)}
  ::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../../design-canvas.jsx"></script>
<script type="text/babel" src="../../ios-frame.jsx"></script>
<script type="text/babel" src="../../tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="HomeA.jsx"></script>
<script type="text/babel" src="HomeB.jsx"></script>

<script type="text/babel">
const { useState } = React;

// ── App shell — manages navigation state ─────────────────────────────────────
function MobileApp({ HomeComponent, variant }) {
  const [tab, setTab]       = useState('home');
  const [screen, setScreen] = useState('home');   // home | results | profile | booking | confirmed
  const [query, setQuery]   = useState('');
  const [biz, setBiz]       = useState(null);

  const go = s => setScreen(s);

  const handleSearch = q => { setQuery(q); setScreen('results'); };
  const handleBiz    = b => { setBiz(b);  setScreen('profile'); };
  const handleBook   = () => setScreen('booking');
  const handleDone   = () => setScreen('confirmed');
  const handleHome   = () => { setScreen('home'); setTab('home'); };

  // sync tab → screen for bookings
  const setTabAndNav = t => {
    setTab(t);
    if (t === 'bookings') setScreen('mybookings');
    else if (t === 'home' || t === 'explore') setScreen('home');
  };

  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', flexDirection: 'column',
      background: 'var(--bg-0)', position: 'relative', overflow: 'hidden',
    }}>
      {/* Screen router */}
      {screen === 'home' && (
        <HomeComponent
          onSearch={handleSearch}
          onBiz={handleBiz}
        />
      )}
      {screen === 'results' && (
        <ResultsScreen
          query={query}
          onBiz={handleBiz}
          onBack={() => setScreen('home')}
        />
      )}
      {screen === 'profile' && (
        <ProfileScreen
          biz={biz}
          onBook={handleBook}
          onBack={() => setScreen('results')}
        />
      )}
      {screen === 'mybookings' && <BookingsScreen />}
      {screen === 'confirmed' && <ConfirmedScreen onHome={handleHome} />}

      {/* Booking sheet — overlaid on profile */}
      {screen === 'booking' && (
        <>
          <ProfileScreen biz={biz} onBook={() => {}} onBack={() => setScreen('results')} />
          <BookingSheet biz={biz} onDone={handleDone} onClose={() => setScreen('profile')} />
        </>
      )}

      {/* Floating nav — hide during booking sheet / confirmed */}
      {!['booking','confirmed'].includes(screen) && (
        <FloatNav tab={tab} setTab={setTabAndNav} />
      )}
    </div>
  );
}

// ── Tweaks ───────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "labelA": "A — Ambient",
  "labelB": "B — Structured",
  "showBothFrames": true
}/*EDITMODE-END*/;

// ── Root ─────────────────────────────────────────────────────────────────────
function Root() {
  const { tweaks, TweaksPanel, TweakSection, TweakText, TweakToggle } = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <DCArtboardsCanvas>
        <DCSection id="variations" title="Mobile Marketplace — AI-powered">
          <DCArtboard id="var-a" label={tweaks.labelA} width={390} height={844}>
            <MobileApp HomeComponent={HomeScreenA} variant="A" />
          </DCArtboard>
          <DCArtboard id="var-b" label={tweaks.labelB} width={390} height={844}>
            <MobileApp HomeComponent={HomeScreenB} variant="B" />
          </DCArtboard>
        </DCSection>

        <DCSection id="screens" title="Individual screens">
          <DCArtboard id="s-results" label="Results feed" width={390} height={844}>
            <MobileApp HomeComponent={HomeScreenA} variant="A-results" />
          </DCArtboard>
          <DCArtboard id="s-profile" label="Business profile" width={390} height={844}>
            <ProfileMock />
          </DCArtboard>
          <DCArtboard id="s-booking" label="Booking flow" width={390} height={844}>
            <BookingMock />
          </DCArtboard>
          <DCArtboard id="s-mybookings" label="My bookings" width={390} height={844}>
            <BookingsMock />
          </DCArtboard>
        </DCSection>

        <DCSection id="inframe" title="In device frame (iOS)">
          <DCArtboard id="frame-a" label={tweaks.labelA + " · framed"} width={430} height={932}>
            <IOSFramed variant="A" />
          </DCArtboard>
          <DCArtboard id="frame-b" label={tweaks.labelB + " · framed"} width={430} height={932}>
            <IOSFramed variant="B" />
          </DCArtboard>
        </DCSection>
      </DCArtboardsCanvas>

      <TweaksPanel>
        <TweakSection label="Labels">
          <TweakText id="labelA" label="Variation A name" />
          <TweakText id="labelB" label="Variation B name" />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

// ── Mock helpers for individual screen artboards ─────────────────────────────
function ProfileMock() {
  const [booking, setBooking] = useState(false);
  const [done, setDone] = useState(false);
  return (
    <div style={{ width:'100%', height:'100%', position:'relative', background:'var(--bg-0)', display:'flex', flexDirection:'column' }}>
      {done
        ? <ConfirmedScreen onHome={() => setDone(false)} />
        : <ProfileScreen biz={BUSINESSES[1]} onBook={() => setBooking(true)} onBack={() => {}} />}
      {booking && !done && <BookingSheet biz={BUSINESSES[1]} onDone={() => { setBooking(false); setDone(true); }} onClose={() => setBooking(false)} />}
    </div>
  );
}

function BookingMock() {
  const [done, setDone] = useState(false);
  return (
    <div style={{ width:'100%', height:'100%', position:'relative', background:'var(--bg-0)', display:'flex', flexDirection:'column' }}>
      {done
        ? <ConfirmedScreen onHome={() => setDone(false)} />
        : <>
            <ProfileScreen biz={BUSINESSES[1]} onBook={() => {}} onBack={() => {}} />
            <BookingSheet biz={BUSINESSES[1]} onDone={() => setDone(true)} onClose={() => {}} />
          </>}
    </div>
  );
}

function BookingsMock() {
  return (
    <div style={{ width:'100%', height:'100%', background:'var(--bg-0)', display:'flex', flexDirection:'column' }}>
      <BookingsScreen />
      <FloatNav tab="bookings" setTab={() => {}} />
    </div>
  );
}

function IOSFramed({ variant }) {
  return (
    <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'#111' }}>
      <IOSDevice width={390} height={844} dark={true} style={{ transform:'scale(0.88)', transformOrigin:'center center' }}>
        <MobileApp HomeComponent={variant==='A' ? HomeScreenA : HomeScreenB} variant={variant} />
      </IOSDevice>
    </div>
  );
}

// ── Auto-start results screen for the "Results" artboard ────────────────────
function ResultsMock() {
  return (
    <div style={{ width:'100%', height:'100%', background:'var(--bg-0)', display:'flex', flexDirection:'column' }}>
      <ResultsScreen query="date night with my girlfriend today" onBiz={() => {}} onBack={() => {}} />
      <FloatNav tab="home" setTab={() => {}} />
    </div>
  );
}

// patch the individual Results artboard
function RootPatched() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <DesignCanvas>
        <DCSection id="variations" title="Mobile Marketplace — AI-powered">
          <DCArtboard id="var-a" label={tweaks.labelA} width={390} height={844}>
            <MobileApp HomeComponent={HomeScreenA} variant="A" />
          </DCArtboard>
          <DCArtboard id="var-b" label={tweaks.labelB} width={390} height={844}>
            <MobileApp HomeComponent={HomeScreenB} variant="B" />
          </DCArtboard>
        </DCSection>

        <DCSection id="screens" title="Individual screens">
          <DCArtboard id="s-results" label="Results feed" width={390} height={844}>
            <ResultsMock />
          </DCArtboard>
          <DCArtboard id="s-profile" label="Business profile" width={390} height={844}>
            <ProfileMock />
          </DCArtboard>
          <DCArtboard id="s-booking" label="Booking flow" width={390} height={844}>
            <BookingMock />
          </DCArtboard>
          <DCArtboard id="s-mybookings" label="My bookings" width={390} height={844}>
            <BookingsMock />
          </DCArtboard>
        </DCSection>

        <DCSection id="inframe" title="In device frame (iOS)">
          <DCArtboard id="frame-a" label={tweaks.labelA + " · framed"} width={430} height={932}>
            <IOSFramed variant="A" />
          </DCArtboard>
          <DCArtboard id="frame-b" label={tweaks.labelB + " · framed"} width={430} height={932}>
            <IOSFramed variant="B" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Artboard labels">
          <TweakText id="labelA" label="Variation A name" />
          <TweakText id="labelB" label="Variation B name" />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RootPatched />);
</script>
</body></html>
