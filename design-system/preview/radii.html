<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Corner radii</div>
<div class="row" style="align-items:flex-end;gap:14px">
  <div style="text-align:center;flex:1"><div style="background:var(--bg-3);border:1px solid var(--border);height:56px;border-radius:4px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:6px">xs&nbsp;·&nbsp;4</div></div>
  <div style="text-align:center;flex:1"><div style="background:var(--bg-3);border:1px solid var(--border);height:56px;border-radius:8px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:6px">sm&nbsp;·&nbsp;8</div></div>
  <div style="text-align:center;flex:1"><div style="background:var(--bg-3);border:1px solid var(--border);height:56px;border-radius:12px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:6px">md&nbsp;·&nbsp;12</div></div>
  <div style="text-align:center;flex:1"><div style="background:var(--bg-3);border:1px solid var(--border);height:56px;border-radius:16px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:6px">lg&nbsp;·&nbsp;16</div></div>
  <div style="text-align:center;flex:1"><div style="background:var(--bg-3);border:1px solid var(--border);height:56px;border-radius:20px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:6px">xl&nbsp;·&nbsp;20</div></div>
  <div style="text-align:center;flex:1"><div style="background:var(--bg-3);border:1px solid var(--border);height:56px;border-radius:9999px"></div><div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:6px">pill</div></div>
</div>
</div></body></html>
