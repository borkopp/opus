name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/opus-dashboard
  MK_IMAGE: ghcr.io/${{ github.repository_owner }}/opus-mk

jobs:
  # ── Build both images in parallel ─────────────────────────────────────────
  build-dashboard:
    name: Build opus-dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push opus-dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./opus-dashboard
          push: true
          # Tag with both :latest and :<sha> so we can pin exact deploys
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          # GitHub Actions cache — drastically speeds up rebuilds
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
          # NEXT_PUBLIC_* vars must be available at build time (inlined by Next.js)
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_CONVEX_SITE_URL=${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN }}

  build-mk:
    name: Build opus-mk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push opus-mk
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./opus-mk/Dockerfile
          push: true
          tags: |
            ${{ env.MK_IMAGE }}:latest
            ${{ env.MK_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=mk
          cache-to: type=gha,mode=max,scope=mk
          build-args: |
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_CONVEX_SITE_URL=${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}

  # ── Deploy: pull pre-built images on VPS ──────────────────────────────────
  deploy:
    name: Deploy to Hetzner VPS
    needs: [build-dashboard, build-mk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copy docker-compose.yml to VPS so it's always in sync with the repo
      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 46.224.68.239
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /opt/opus/

      - name: Pull new images & restart containers
        uses: appleboy/ssh-action@v1
        with:
          host: 46.224.68.239
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Authenticate with GHCR to pull private images
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/opus

            # Pin exact SHA so both containers are from this exact commit
            export DASHBOARD_IMAGE=${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
            export MK_IMAGE=${{ env.MK_IMAGE }}:${{ github.sha }}

            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up dangling images to keep disk usage low
            docker image prune -f

            echo "✓ Deployed dashboard → port 3006, mk → port 3007"
