<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Shadows — multi-layer, inset + outer</div>
<div class="row" style="gap:16px;padding:8px 0 20px">
  <div style="flex:1;text-align:center">
    <div style="background:#1e1e1c;height:60px;border-radius:12px;border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,0.04), 0 1px 2px rgba(0,0,0,0.4)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:8px">shadow-s</div>
  </div>
  <div style="flex:1;text-align:center">
    <div style="background:#1e1e1c;height:60px;border-radius:12px;border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.3)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:8px">shadow-m</div>
  </div>
  <div style="flex:1;text-align:center">
    <div style="background:#1e1e1c;height:60px;border-radius:12px;border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 6px 12px rgba(0,0,0,0.35), 0 20px 40px rgba(0,0,0,0.45)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:8px">shadow-l</div>
  </div>
  <div style="flex:1;text-align:center">
    <div style="background:#ce5d45;height:60px;border-radius:12px;box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 3px 5px rgba(206,93,69,0.5), 0 10px 20px rgba(0,0,0,0.35)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:8px">shadow-cta</div>
  </div>
</div>
</div></body></html>
