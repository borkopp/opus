services:
  opus-dashboard:
    image: ${DASHBOARD_IMAGE}
    ports:
      - "3006:3000"
    env_file:
      - /opt/opus/.env.dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  opus-mk:
    image: ${MK_IMAGE}
    ports:
      - "3007:3000"
    env_file:
      - /opt/opus/.env.mk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
