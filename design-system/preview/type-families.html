<!doctype html>
<html><head><meta charset="utf-8"><title>Families</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Type families</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 20px">
  <div>
    <div style="font-family:var(--font-display);font-size:28px;font-weight:500;letter-spacing:-0.01em">DM Sans Display</div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:2px">Display / headings</div>
  </div>
  <div>
    <div style="font-family:var(--font-body);font-size:28px;font-weight:500">DM Sans</div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:2px">Body / UI</div>
  </div>
  <div>
    <div style="font-family:var(--font-mono);font-size:22px">DM Mono 123</div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:2px">Tabular numerics / labels</div>
  </div>
  <div>
    <div style="font-family:'Playfair Display',serif;font-style:italic;font-size:28px;color:var(--accent);font-weight:500">Playfair italic</div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:2px">Accent word only</div>
  </div>
  <div>
    <div style="font-family:var(--font-logo);font-size:26px;letter-spacing:0.08em">OPUS</div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:2px">Audiowide — logo only</div>
  </div>
  <div>
    <div style="font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--fg-2)">Eyebrow / chapter</div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:6px">DM Sans 10px 700 — 0.15em</div>
  </div>
</div>
</div></body></html>
