<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Spacing — 4px base</div>
<div style="display:flex;flex-direction:column;gap:8px">
  <div style="display:flex;align-items:center;gap:16px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:44px">4</span><div style="background:var(--accent);height:14px;width:4px;border-radius:2px"></div><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">space-1 · tight icon gaps</span></div>
  <div style="display:flex;align-items:center;gap:16px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:44px">8</span><div style="background:var(--accent);height:14px;width:8px;border-radius:2px"></div><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">space-2 · chip gap</span></div>
  <div style="display:flex;align-items:center;gap:16px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:44px">12</span><div style="background:var(--accent);height:14px;width:12px;border-radius:2px"></div><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">space-3 · form element gap</span></div>
  <div style="display:flex;align-items:center;gap:16px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:44px">16</span><div style="background:var(--accent);height:14px;width:16px;border-radius:2px"></div><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">space-4 · card padding base</span></div>
  <div style="display:flex;align-items:center;gap:16px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:44px">24</span><div style="background:var(--accent);height:14px;width:24px;border-radius:2px"></div><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">space-6 · section inner</span></div>
  <div style="display:flex;align-items:center;gap:16px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:44px">48</span><div style="background:var(--accent);height:14px;width:48px;border-radius:2px"></div><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">space-12 · section gutter</span></div>
  <div style="display:flex;align-items:center;gap:16px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:44px">96</span><div style="background:var(--accent);height:14px;width:96px;border-radius:2px"></div><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">space-24 · hero / section break</span></div>
</div>
</div></body></html>
