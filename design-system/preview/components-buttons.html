<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Buttons</div>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <button style="font-family:var(--font-body);font-size:14px;font-weight:500;background:var(--accent);color:#fff;border:0;border-radius:9999px;padding:10px 20px;box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 3px 5px rgba(206,93,69,0.5);cursor:pointer">Започнете бесплатно</button>
  <button style="font-family:var(--font-body);font-size:14px;font-weight:500;background:transparent;color:var(--fg-1);border:1px solid var(--border-strong);border-radius:9999px;padding:10px 20px;cursor:pointer">Дознајте повеќе</button>
  <button style="font-family:var(--font-body);font-size:14px;font-weight:500;background:var(--bg-3);color:var(--fg-1);border:1px solid var(--border);border-radius:9999px;padding:10px 20px;cursor:pointer">Tertiary</button>
  <button style="font-family:var(--font-body);font-size:14px;font-weight:500;background:transparent;color:var(--fg-2);border:0;padding:10px 12px;cursor:pointer">Ghost →</button>
</div>
<div style="display:flex;gap:12px;align-items:center;margin-top:14px">
  <button style="font-family:var(--font-body);font-size:13px;font-weight:500;background:var(--accent);color:#fff;border:0;border-radius:9999px;padding:7px 14px;cursor:pointer">Small</button>
  <button style="font-family:var(--font-body);font-size:15px;font-weight:500;background:var(--accent);color:#fff;border:0;border-radius:9999px;padding:13px 26px;box-shadow:0 3px 5px rgba(206,93,69,0.5);cursor:pointer">Large CTA</button>
  <button disabled style="font-family:var(--font-body);font-size:14px;font-weight:500;background:#2a2a28;color:#57534e;border:0;border-radius:9999px;padding:10px 20px;cursor:not-allowed">Disabled</button>
</div>
</div></body></html>
