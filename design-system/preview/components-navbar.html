<!doctype html>
<html><head><meta charset="utf-8"><title>Navbar</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Navbar — blurred pill (scrolled state)</div>
<div style="position:relative;height:110px;border-radius:16px;background:url('../assets/abstract-bg.jpg') center/cover no-repeat;overflow:hidden;border:1px solid var(--border)">
  <div style="position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;background:rgba(13,13,13,0.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.06);border-radius:9999px;padding:8px 8px 8px 18px">
    <span style="font-family:var(--font-logo);font-size:17px;letter-spacing:0.08em;color:#faf9f7">OPUS</span>
    <div style="display:flex;gap:4px">
      <a style="font-family:var(--font-body);font-size:13px;color:#c7c3bc;padding:6px 12px;border-radius:9999px">Features</a>
      <a style="font-family:var(--font-body);font-size:13px;color:#faf9f7;padding:6px 12px;border-radius:9999px;background:rgba(255,255,255,0.08)">Pricing</a>
      <a style="font-family:var(--font-body);font-size:13px;color:#c7c3bc;padding:6px 12px;border-radius:9999px">About</a>
    </div>
    <button style="font-family:var(--font-body);font-size:13px;font-weight:500;background:#ce5d45;color:#fff;border:0;border-radius:9999px;padding:7px 16px;box-shadow:0 3px 5px rgba(206,93,69,0.5)">Започнете →</button>
  </div>
</div>
</div></body></html>
