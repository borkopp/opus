<!doctype html>
<html><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Badges &amp; category pills</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <span style="font-family:var(--font-body);font-size:11px;font-weight:500;background:rgba(206,93,69,0.12);color:#f4a07a;border:1px solid rgba(206,93,69,0.25);padding:4px 10px;border-radius:9999px">Нов</span>
  <span style="font-family:var(--font-body);font-size:11px;font-weight:500;background:rgba(78,169,122,0.14);color:#6fcf97;border:1px solid rgba(78,169,122,0.28);padding:4px 10px;border-radius:9999px">Open now</span>
  <span style="font-family:var(--font-body);font-size:11px;font-weight:500;background:rgba(227,179,74,0.12);color:#e3b34a;border:1px solid rgba(227,179,74,0.25);padding:4px 10px;border-radius:9999px">★ 4.9</span>
  <span style="font-family:var(--font-body);font-size:11px;font-weight:500;background:#1e1e1c;color:var(--fg-2);border:1px solid var(--border);padding:4px 10px;border-radius:9999px">Популарно</span>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center">
  <button style="font-family:var(--font-body);font-size:12px;font-weight:500;background:#faf9f7;color:#141412;border:0;padding:7px 14px;border-radius:9999px;cursor:pointer">All</button>
  <button style="font-family:var(--font-body);font-size:12px;font-weight:500;background:#1e1e1c;color:var(--fg-2);border:1px solid var(--border);padding:7px 14px;border-radius:9999px;cursor:pointer">Barbershop</button>
  <span style="color:var(--fg-4)">✦</span>
  <button style="font-family:var(--font-body);font-size:12px;font-weight:500;background:#1e1e1c;color:var(--fg-2);border:1px solid var(--border);padding:7px 14px;border-radius:9999px;cursor:pointer">Hair Salon</button>
  <button style="font-family:var(--font-body);font-size:12px;font-weight:500;background:#1e1e1c;color:var(--fg-2);border:1px solid var(--border);padding:7px 14px;border-radius:9999px;cursor:pointer">Nail</button>
  <button style="font-family:var(--font-body);font-size:12px;font-weight:500;background:#1e1e1c;color:var(--fg-2);border:1px solid var(--border);padding:7px 14px;border-radius:9999px;cursor:pointer">Spa</button>
</div>
</div></body></html>
