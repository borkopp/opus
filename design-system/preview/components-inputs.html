<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Inputs &amp; Search</div>
<div style="display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;align-items:center;gap:10px;background:var(--bg-3);border:1px solid var(--border);border-radius:14px;padding:12px 16px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8680" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input placeholder="Search for businesses, services, or locations…" style="background:transparent;border:0;outline:none;color:var(--fg-1);font-family:var(--font-body);font-size:14px;flex:1"/>
    <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);border:1px solid var(--border);border-radius:4px;padding:2px 6px">⌘K</span>
  </div>
  <input placeholder="Business name" style="background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--fg-1);font-family:var(--font-body);font-size:14px;outline:none"/>
  <input placeholder="Focused input" style="background:var(--bg-2);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;color:var(--fg-1);font-family:var(--font-body);font-size:14px;outline:none;box-shadow:0 0 0 3px rgba(206,93,69,0.18)"/>
</div>
</div></body></html>
