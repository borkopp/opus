name: Web CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  dashboard:
    name: Dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: opus-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: opus-dashboard
        run: npm ci

      - name: Lint
        working-directory: opus-dashboard
        run: npm run lint

      - name: Type-check
        working-directory: opus-dashboard
        run: npm run typecheck

      - name: Run tests
        working-directory: opus-dashboard
        run: npm test

      - name: Build
        working-directory: opus-dashboard
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://ci-placeholder.convex.cloud' }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL || 'https://ci-placeholder.convex.site' }}
          NEXT_PUBLIC_ROOT_DOMAIN: opus.mk
        run: npm run build

  landing:
    name: Landing checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: opus-landing/package-lock.json

      - name: Install dependencies
        working-directory: opus-landing
        run: npm ci

      - name: Lint
        working-directory: opus-landing
        run: npm run lint

      - name: Build
        working-directory: opus-landing
        run: npm run build
