<!doctype html>
<html><head><meta charset="utf-8"><title>Sidebar</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Dashboard sidebar item</div>
<div style="display:flex;gap:14px">
  <div style="flex:1;background:var(--bg-2);border:1px solid var(--border);border-radius:14px;padding:10px 8px">
    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg-4);color:#faf9f7;font-family:var(--font-body);font-size:13px;font-weight:500">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ce5d45" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      Home
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#c7c3bc;font-family:var(--font-body);font-size:13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8680" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      Bookings
      <span style="margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--fg-3);background:var(--bg-5);padding:1px 6px;border-radius:9999px">12</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#c7c3bc;font-family:var(--font-body);font-size:13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8680" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2M17 11a4 4 0 010-8"/></svg>
      Staff
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#c7c3bc;font-family:var(--font-body);font-size:13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8680" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h12"/></svg>
      Services
    </div>
  </div>
  <div style="flex:1;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);line-height:1.7">
    <div>default · <span style="color:var(--fg-2)">bg transparent</span></div>
    <div>hover &nbsp; · <span style="color:var(--fg-2)">bg-3, icon→accent</span></div>
    <div>active &nbsp;· <span style="color:var(--fg-2)">bg-4, fg-1, icon accent</span></div>
    <div style="margin-top:6px">Trailing count in pill (bg-5)</div>
    <div>Radius 10 · gap 10 · padding 10/12</div>
  </div>
</div>
</div></body></html>
