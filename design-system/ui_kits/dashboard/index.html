<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>OPUS Dashboard · UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#000;color:var(--fg-1);font-family:var(--font-body);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv01";}
  *{box-sizing:border-box}
  ::selection{background:var(--accent);color:#fff}
  *::-webkit-scrollbar{width:6px;height:6px}
  *::-webkit-scrollbar-thumb{background:var(--bg-5);border-radius:9999px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="StatCard.jsx"></script>
<script type="text/babel" src="Schedule.jsx"></script>
<script type="text/babel" src="Inbox.jsx"></script>
<script type="text/babel" src="RevenueChart.jsx"></script>
<script type="text/babel">
const { useState } = React;

function App() {
  const [active, setActive] = useState('home');
  const titles = {
    home:{t:'Home', s:'Thu · Apr 23 · Good morning, Andrej'},
    bookings:{t:'Bookings', s:'12 scheduled today'},
    inbox:{t:'Inbox', s:'3 unread · AI handling 2'},
    staff:{t:'Staff', s:'4 team members'},
    services:{t:'Services', s:'12 services, 3 categories'},
    clients:{t:'Clients', s:'284 total · 42 new this month'},
    finance:{t:'Finance', s:'Apr · €8,128 revenue'},
    analytics:{t:'Analytics', s:'Last 30 days'},
    settings:{t:'Settings', s:'Studio Nord workspace'},
  };
  const cur = titles[active];
  return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--bg-1)'}}>
      <Sidebar active={active} onChange={setActive}/>
      <main style={{flex:1,minWidth:0,display:'flex',flexDirection:'column'}}>
        <TopBar title={cur.t} sub={cur.s}/>
        <div style={{padding:'28px',flex:1}}>
          {active==='home' && (
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:14,marginBottom:20}}>
              <StatCard label="Bookings today"  value="12" delta="+3"  deltaLabel="vs avg"/>
              <StatCard label="Revenue today"   value="€248" delta="+12%" deltaLabel="vs Wed"/>
              <StatCard label="Utilization"     value="74" unit="%"     delta="+6%" deltaLabel="w/w"/>
              <StatCard label="AI replies"      value="42" delta="≈ 2h saved" deltaLabel="" glow/>
            </div>
          )}
          {active==='home' && (
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
              <div style={{display:'flex',flexDirection:'column',gap:20}}>
                <Schedule/>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:20}}>
                <RevenueChart/>
                <Inbox/>
              </div>
            </div>
          )}
          {active==='bookings' && <Schedule/>}
          {active==='inbox' && <Inbox/>}
          {active==='analytics' && <RevenueChart/>}
          {!['home','bookings','inbox','analytics'].includes(active) && (
            <div style={{background:'var(--bg-3)',border:'1px solid var(--border)',borderRadius:16,padding:60,textAlign:'center'}}>
              <div style={{fontFamily:'var(--font-display)',fontSize:20,fontWeight:500,color:'var(--fg-1)',letterSpacing:'-0.01em'}}>{cur.t}</div>
              <div style={{fontFamily:'var(--font-body)',fontSize:13,color:'var(--fg-3)',marginTop:8}}>{cur.s}</div>
              <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--fg-4)',marginTop:24}}>— UI kit stub —</div>
            </div>
          )}
        </div>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
