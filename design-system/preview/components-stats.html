<!doctype html>
<html><head><meta charset="utf-8"><title>Stat widgets</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Stat widgets</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
  <div style="background:var(--bg-3);border:1px solid var(--border);border-radius:16px;padding:14px">
    <div style="font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--fg-3)">Today</div>
    <div style="font-family:var(--font-display);font-size:28px;font-weight:500;color:var(--fg-1);margin-top:6px;letter-spacing:-0.02em">24 <span style="font-family:var(--font-body);font-size:13px;color:var(--fg-3);font-weight:400">bookings</span></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:#6fcf97;margin-top:2px">↑ 12%</div>
  </div>
  <div style="background:var(--bg-3);border:1px solid var(--border);border-radius:16px;padding:14px">
    <div style="font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--fg-3)">Revenue</div>
    <div style="font-family:var(--font-display);font-size:28px;font-weight:500;color:var(--fg-1);margin-top:6px;letter-spacing:-0.02em">€1,248</div>
    <div style="font-family:var(--font-mono);font-size:11px;color:#6fcf97;margin-top:2px">↑ 8%</div>
  </div>
  <div style="background:var(--bg-3);border:1px solid var(--border);border-radius:16px;padding:14px;position:relative;overflow:hidden">
    <div style="position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(206,93,69,0.18),transparent 60%)"></div>
    <div style="position:relative">
      <div style="font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#f4a07a">AI replies</div>
      <div style="font-family:var(--font-display);font-size:28px;font-weight:500;color:var(--fg-1);margin-top:6px;letter-spacing:-0.02em">42</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:2px">saved ≈ 2h</div>
    </div>
  </div>
</div>
</div></body></html>
