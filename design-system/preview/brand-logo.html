<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="card.css"></head>
<body><div class="card">
<div class="label-eyebrow">Brand — logo &amp; wordmark</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div style="background:var(--bg-2);border:1px solid var(--border);border-radius:16px;padding:28px;display:flex;align-items:center;justify-content:center">
    <span style="font-family:var(--font-logo);font-size:42px;letter-spacing:0.08em;color:#faf9f7">OPUS</span>
  </div>
  <div style="background:url('../assets/abstract-bg.jpg') center/cover,#141412;border:1px solid var(--border);border-radius:16px;padding:28px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative">
    <span style="font-family:var(--font-logo);font-size:68px;letter-spacing:0.08em;color:transparent;-webkit-text-stroke:1px rgba(250,249,247,0.5);line-height:1">OPUS</span>
  </div>
</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:10px">Audiowide · 0.08em · solid (chrome) / 1px stroke (ghost watermark)</div>
</div></body></html>
